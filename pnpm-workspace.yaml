  # which drops the default export that astro's `import yaml from "js-yaml"` needs
  js-yaml@>=4.0.0 <=4.1.1: '>=4.2.0 <5'
  undici@>=7.0.0 <7.28.0: '>=7.28.0'
  undici@>=7.23.0 <7.28.0: '>=7.28.0'
  uuid@<14.0.0: '>=14.0.0'
  vite@>=7.0.0 <=7.3.4: '>=7.3.5'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
