allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  astro@<6.3.3: '>=6.3.3'
  astro@<6.4.6: '>=6.4.6'
  devalue@>=5.6.3 <=5.8.0: '>=5.8.1'
  dompurify@<3.4.7: '>=3.4.7'
  dompurify@<3.4.9: '>=3.4.9'
  dompurify@<=3.4.10: '>=3.4.11'
  dompurify@<=3.4.5: '>=3.4.6'
  dompurify@<=3.4.6: '>=3.4.7'
  dompurify@>=3.0.0 <=3.4.7: '>=3.4.8'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
